consent_manager:
  ros__parameters:
    consent_mode: dynamic
    policy_file: privacy_policy.yaml

privacy_gate:
  ros__parameters:
    consent_mode: dynamic
    policy_file: privacy_policy.yaml

consent_logger:
  ros__parameters:
    consent_mode: dynamic
    log_directory: "~/.ros/dynamic_consent/logs"
    session_timeout_seconds: 900.0
    enable_raw_sensor_storage: false

scenario_simulator:
  ros__parameters:
    consent_mode: dynamic
    startup_delay_seconds: 2.0
    stage_delay_seconds: 1.0
